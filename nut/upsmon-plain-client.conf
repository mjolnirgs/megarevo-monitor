# /etc/nut/upsmon.conf — PLAIN secondary monitor template.
#
# Use this as-is for any host that just needs a normal graceful shutdown
# when the battery gets low, with no special behavior. If a host needs
# something different, see the other examples in this directory:
#   - upsmon-timed-shutdown-client.conf — sheds on a timer (e.g. after N
#     minutes on battery) regardless of SOC, for a host that's not needed
#     during an outage and whose early shutdown buys runway for others.
#   - upsmon-proxmox-client.conf — drives an explicit per-VM guest-agent
#     shutdown before the host itself powers off.
#
# Password must match the [secondary] account in upsd.users on the NUT
# server host. Replace 192.0.2.10 below with that host's real LAN IP —
# using the IP rather than a hostname avoids a DNS dependency at exactly
# the moment you need shutdown to work reliably.

MONITOR megarevo@192.0.2.10 1 secondary CHANGE_ME_SECONDARY_PASSWORD secondary

MINSUPPLIES 1
POLLFREQ 15
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
FINALDELAY 5

# Fires once upsmon sees FSD (forced shutdown — "OB LB" from the server,
# meaning on battery AND at/below battery_charge_low). Runs as root.
SHUTDOWNCMD "/sbin/shutdown -h +0 'NUT: megarevo battery low, shutting down'"
