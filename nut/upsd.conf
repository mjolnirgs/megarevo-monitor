# /etc/nut/upsd.conf on the NUT server host.
#
# LISTEN on both loopback and this host's LAN address so remote upsmon
# clients can actually reach it. Without an explicit LISTEN for the LAN
# address, some distros' default upsd.conf restricts to 127.0.0.1 only,
# which would silently make every remote client unreachable.
#
# 192.0.2.10 below is a documentation placeholder (RFC 5737) — replace it
# with this host's real, stable LAN IP (a static DHCP reservation is
# worth setting up if it doesn't have one already, for the same reason
# the inverter's own dongle needs one — see the main README).
LISTEN 127.0.0.1 3493
LISTEN 192.0.2.10 3493
