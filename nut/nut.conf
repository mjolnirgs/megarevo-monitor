# /etc/nut/nut.conf on the NUT server host (same host as the poller, e.g.
# your Nagios Pi).
#
# netserver: this host runs upsd and serves status to remote upsmon
# clients on your other hosts. It does not need a real UPS driver talking
# to hardware — the dummy-ups driver below reads megarevo-monitor's own
# telemetry instead (see ups.conf).
MODE=netserver
