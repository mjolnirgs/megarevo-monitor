# /etc/nut/upsmon.conf — Proxmox VE client example.
#
# Same SOC-based trigger as the plain client (OB LB at/below
# battery_charge_low), but SHUTDOWNCMD drives an explicit per-VM
# guest-agent shutdown first via shutdown-proxmox-vms.sh, for a Proxmox
# host whose guest VMs have qemu-guest-agent — see that script for
# details.
#
# Password must match the [secondary] account in upsd.users on the NUT
# server host. Replace 192.0.2.10 below with that host's real LAN IP.

MONITOR megarevo@192.0.2.10 1 secondary CHANGE_ME_SECONDARY_PASSWORD secondary

MINSUPPLIES 1
POLLFREQ 15
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
FINALDELAY 5

SHUTDOWNCMD "/usr/local/bin/shutdown-proxmox-vms.sh"
