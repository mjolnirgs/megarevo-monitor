# /etc/nut/upsmon.conf — TIMED shutdown client example.
#
# Use this for a host that should shed early into an outage on a fixed
# timer, regardless of the battery's actual SOC — e.g. a host that isn't
# needed during an outage, so shutting it down early leaves more battery
# runway for hosts that matter more. The SOC-based SHUTDOWNCMD below
# stays wired up too, as a safety net in case the battery drains faster
# than the timer budget assumes (see notify-timed-shutdown.sh for the
# actual timer, and its SHUTDOWN_DELAY_MINUTES variable).
#
# Password must match the [secondary] account in upsd.users on the NUT
# server host. Replace 192.0.2.10 below with that host's real LAN IP.

MONITOR megarevo@192.0.2.10 1 secondary CHANGE_ME_SECONDARY_PASSWORD secondary

MINSUPPLIES 1
POLLFREQ 15
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
FINALDELAY 5

# Safety net only — see notify-timed-shutdown.sh for the actual timer logic.
SHUTDOWNCMD "/sbin/shutdown -c 2>/dev/null; /sbin/shutdown -h +0 'NUT: megarevo battery low, shutting down'"

# The on-battery timer itself, via NUT's event-notify hook.
NOTIFYCMD /usr/local/bin/notify-timed-shutdown.sh
NOTIFYFLAG ONBATT SYSLOG+EXEC
NOTIFYFLAG ONLINE SYSLOG+EXEC
