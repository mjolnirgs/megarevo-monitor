# /etc/nut/upsmon.conf on the NUT server host itself.
#
# This is the required PRIMARY monitor for the "megarevo" UPS — NUT's
# design wants exactly one, and it's simplest to run it on the same host
# as upsd. Deliberately harmless: SHUTDOWNCMD just logs rather than
# powering anything off, because this host needs to stay up and
# monitoring through the whole outage, not shut itself down. The actual
# host shutdowns happen on your remote SECONDARY monitors instead (see
# upsmon-plain-client.conf and friends), which have real SHUTDOWNCMDs.
#
# Password must match the [primary] account in upsd.users.
#
# NOTIFYCMD/NOTIFYFLAG below email AND Telegram on every state transition
# (on battery, back online, low battery, FSD, lost/restored comms with
# upsd) — see notify-alert.sh, which needs an email recipient and a
# Telegram bot's chat ID set before either is useful (a minimal example
# Telegram-sender script, notify_by_telegram.sh, is included). Wired here
# (not on the secondaries) so you get one alert per event instead of one
# from every host.

MONITOR megarevo@localhost 1 primary CHANGE_ME_PRIMARY_PASSWORD primary

MINSUPPLIES 1
SHUTDOWNCMD "/usr/bin/logger -t nut-fsd 'megarevo-monitor: FSD reached (battery.charge.low crossed) - primary monitor takes no shutdown action on this host by design'"
POLLFREQ 15
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15

NOTIFYCMD /usr/local/bin/notify-alert.sh
NOTIFYFLAG ONLINE    SYSLOG+EXEC
NOTIFYFLAG ONBATT    SYSLOG+EXEC
NOTIFYFLAG LOWBATT   SYSLOG+EXEC
NOTIFYFLAG FSD       SYSLOG+EXEC
NOTIFYFLAG COMMBAD   SYSLOG+EXEC
NOTIFYFLAG COMMOK    SYSLOG+EXEC
NOTIFYFLAG SHUTDOWN  SYSLOG+EXEC
