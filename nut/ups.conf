# /etc/nut/ups.conf on the Nagios Pi.
#
# dummy-ups in "dummy" mode: `port` here is a plain data file (extension
# other than .seq), not a serial device or a scripted test sequence. The
# driver watches that file's mtime and reloads it whenever it changes —
# which is exactly what megarevo-monitor's poller.py does every poll
# cycle (30s by default) when nut.enabled is true in its own config.yaml.
# This is how NUT ends up treating the Megarevo's real telemetry as if it
# came from a physical UPS talking to upsd, with no custom NUT driver.
#
# No real hardware is involved and no shutdown command is ever issued
# through this driver — the actual host shutdowns happen client-side via
# upsmon's SHUTDOWNCMD on each monitored host (see the nut/upsmon-*.conf
# files in this repo), triggered by the "LB" (low battery) status flag
# this file's data drives.

[megarevo]
    driver = dummy-ups
    port = /var/lib/megarevo-monitor/nut-dummy.dev
    desc = "Megarevo R8KLNA hybrid inverter (via megarevo-monitor poller)"
