# Nagios host + service definitions for the Megarevo inverter.
# Drop into your Nagios objects directory (e.g. /usr/local/nagios/etc/objects/)
# and add an `cfg_file` line for it in nagios.cfg, or place under whatever
# cfg_dir your install already scans.
#
# All three services are PASSIVE-ONLY: the poller (systemd unit
# megarevo-poller.service) submits results directly into the command pipe.
# check_freshness is what catches "the poller died" or "the RS485 link
# dropped" — without it, Nagios would just keep showing the last good
# result forever, which is exactly the kind of silent-stale-data failure
# this whole project started from (the inverter's own charge-current
# register going stale without anything noticing).
#
# Host uses the `linux-server` template and services use `generic-service`
# (both already carry contact_groups admins in this install's templates.cfg)
# rather than repeating contact_groups by hand here.

# check_dummy isn't defined anywhere on a stock nagios4/Debian install —
# it's a real plugin binary (from the monitoring-plugins-basic package),
# just not wired into commands.cfg by default. It's used below purely as
# a placeholder check_command (Nagios' preflight requires one even though
# these services are 100% passive and it never actually executes).
# Defined here so this file doesn't depend on another package's config.
define command {
    command_name    check_dummy
    command_line    /usr/lib/nagios/plugins/check_dummy $ARG1$ $ARG2$
}

define host {
    use                  linux-server
    host_name           megarevo-inverter
    alias                Megarevo R8KLNA (server room EPS)
    address              127.0.0.1
    check_command        check-host-alive
    max_check_attempts   3
    check_period         24x7
    notification_interval 60
    notification_period  24x7
}

# battery-soc restored (2026-09-28): soc_percent is confirmed for real —
# address 12613, scale 0.1, cross-checked live against the app across
# three separate readings during an actual charge/discharge cycle. The
# earlier 5793 guess is retired as (likely) SoH, not SoC.
define service {
    use                             generic-service
    host_name                      megarevo-inverter
    service_description            battery-soc
    check_command                  check_dummy!3!"No passive result yet"
    active_checks_enabled          0
    passive_checks_enabled         1
    check_freshness                1
    freshness_threshold            180   ; 6x the default 30s poll interval
    max_check_attempts             1
    check_period                   24x7
    notification_interval          30
    notification_period            24x7
    notifications_enabled          1
}

define service {
    use                             generic-service
    host_name                      megarevo-inverter
    service_description            grid-status
    check_command                  check_dummy!3!"No passive result yet"
    active_checks_enabled          0
    passive_checks_enabled         1
    check_freshness                1
    freshness_threshold            180
    max_check_attempts             1
    check_period                   24x7
    notification_interval          15   ; grid loss should page fast, this drives your NUT shutdown timing
    notification_period            24x7
    notifications_enabled          1
}

# battery-soc-decline restored (2026-09-28) alongside battery-soc above —
# see that block's comment.
define service {
    use                             generic-service
    host_name                      megarevo-inverter
    service_description            battery-soc-decline
    check_command                  check_dummy!3!"No passive result yet"
    active_checks_enabled          0
    passive_checks_enabled         1
    check_freshness                1
    freshness_threshold            180
    max_check_attempts             1
    check_period                   24x7
    notification_interval          60
    notification_period            24x7
    notifications_enabled          1
}

# Informational — battery_current_a/battery_power_w (found 2026-09-28
# during the breaker-off discharge test) have no established normal range
# yet, so poller.py always reports this OK with the live reading in the
# plugin output and perfdata (voltage/current/power) for graphing.
# check_freshness still catches the poller dying; notifications stay on
# for that reason even though the check itself never alerts on its own.
define service {
    use                             generic-service
    host_name                      megarevo-inverter
    service_description            battery-power
    check_command                  check_dummy!3!"No passive result yet"
    active_checks_enabled          0
    passive_checks_enabled         1
    check_freshness                1
    freshness_threshold            180
    max_check_attempts             1
    check_period                   24x7
    notification_interval          30
    notification_period            24x7
    notifications_enabled          1
}
